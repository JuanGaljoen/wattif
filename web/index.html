<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wattif — what a solar or wind farm would have generated</title>
<meta name="description"
      content="Six South African sites, ten years of real weather, and what a
               solar or wind farm at each would have generated.">

<!-- Everything is vendored. No CDN, no build step, no npm: the page is
     served as-is by FastAPI (specs/slice-5a.md, Frontend). -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<header class="masthead">
  <h1>wattif</h1>
  <p>Watt if you'd built it there?</p>
</header>

<nav class="sites" id="sites" aria-label="Sites"></nav>

<section class="detail" id="detail" hidden>
  <h2 id="detail-name"></h2>
  <dl>
    <dt>Latitude</dt>      <dd id="detail-lat"></dd>
    <dt>Longitude</dt>     <dd id="detail-lon"></dd>
    <dt>Elevation</dt>     <dd id="detail-elev"></dd>
    <dt>Panel tilt</dt>    <dd id="detail-tilt"></dd>
    <dt>Panels face</dt>   <dd id="detail-facing"></dd>
  </dl>

  <h3>Reliability, 2016&ndash;2025</h3>
  <table class="reliability" id="reliability">
    <thead>
      <tr><td></td><th scope="col">Solar</th><th scope="col">Wind</th>
          <th scope="col">50/50</th></tr>
    </thead>
    <tbody id="reliability-body"></tbody>
  </table>
  <p class="hint" id="reliability-hint">Pick a lull to mark it on the chart.</p>
</section>

<section class="chart-dock">
  <div class="chart-head">
    <h2 id="chart-title">Daily generation</h2>
    <div class="ranges" id="ranges" role="group" aria-label="Time range"></div>
    <div class="layers" id="layers" role="group" aria-label="Series"></div>
    <span class="hint chart-hint">drag to zoom &middot; double-click resets &middot;
      click a legend entry to hide one line</span>
    <label class="capacity">
      Rated capacity
      <input id="capacity" type="number" value="100" min="1" max="10000" step="10"
             aria-label="Rated capacity in megawatts">
      MW
    </label>
  </div>
  <div id="chart"></div>
</section>

<script src="vendor/leaflet.js"></script>
<script src="vendor/uPlot.iife.min.js"></script>
<script src="app.js"></script>
</body>
</html>
