name: wattif

services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resource
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resource"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      # The db service, not localhost: inside the compose network the
      # hostname is the service name.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/resource
      # Optional. Empty -> the map falls back to OSM tiles inverted in CSS.
      CARTO_KEY: ${CARTO_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
